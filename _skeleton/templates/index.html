<!DOCTYPE html>
<html>
<head><title>App</title></head>
<body>
    <h1>Items</h1>
    <a href="/add">Add New</a>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        {% for item in items %}
        <tr>
            <td>{{ item["id"] }}</td>
            <td>{{ item["name"] }}</td>
            <td>{{ item["description"] }}</td>
            <td>
                <a href="/edit/{{ item['id'] }}">Edit</a>
                <a href="/delete/{{ item['id'] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
