<!DOCTYPE html>
<html>
<head><title>Edit</title></head>
<body>
    <h1>Edit Order</h1>
    <form method="POST">
        <label for="customerName">Customer Name</label><br>
        <input type="text" name="customerName" value="{{ order['customerName'] }}" required><br><br>

        <label for="itemName">Item Name</label><br>
        <input type="text" name="itemName" value="{{ order['itemName'] }}" required><br><br>

        <label for="quantity">Quantity</label><br>
        <input type="number" name="quantity" value="{{ order['quantity'] }}" required><br><br>

        <label for="totalPrice">Total Price</label><br>
        <input type="number" name="totalPrice" step="0.01" value="{{ order['totalPrice'] }}" required><br><br>

        <label for="orderDate">Order Date</label><br>
        <input type="date" name="orderDate" value="{{ order['orderDate'] }}" required><br><br>

        <button type="submit">Update</button>
    </form>
    <a href="/orders">Back</a>
</body>
</html>
