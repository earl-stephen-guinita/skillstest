<!DOCTYPE html>
<html>
<head><title>Menu Items</title></head>
<body>
    <h1>Menu Items</h1>
    <a href="/menu_items/add">Add New</a>
    <a href="/menu_items/search">Search</a>
    <a href="/">Back to Main Menu</a>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Item Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        {% for menu_item in menu_items %}
        <tr>
            <td>{{ menu_item["id"] }}</td>
            <td>{{ menu_item["itemName"] }}</td>
            <td>{{ menu_item["category"] }}</td>
            <td>{{ menu_item["price"] }}</td>
            <td>{{ menu_item["status"] }}</td>
            <td>
                <a href="/menu_items/edit/{{ menu_item['id'] }}">Edit</a>
                <a href="/menu_items/delete/{{ menu_item['id'] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
