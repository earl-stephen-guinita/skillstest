<!DOCTYPE html>
<html>
<head><title>Rooms</title></head>
<body>
    <h1>Rooms</h1>
    <a href="/rooms/add">Add New</a>
    <a href="/rooms/search">Search</a>
    <a href="/">Back to Main Menu</a>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Room Number</th>
            <th>Room Type</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        {% for room in rooms %}
        <tr>
            <td>{{ room["id"] }}</td>
            <td>{{ room["roomNumber"] }}</td>
            <td>{{ room["roomType"] }}</td>
            <td>{{ room["price"] }}</td>
            <td>{{ room["status"] }}</td>
            <td>
                <a href="/rooms/edit/{{ room['id'] }}">Edit</a>
                <a href="/rooms/delete/{{ room['id'] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
