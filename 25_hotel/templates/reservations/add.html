<!DOCTYPE html>
<html>
<head><title>Add</title></head>
<body>
    <h1>Add Reservation</h1>
    <form method="POST">
        <label for="guestName">Guest Name</label><br>
        <input type="text" name="guestName" placeholder="Guest Name" required><br><br>

        <label for="roomNumber">Room Number</label><br>
        <input type="text" name="roomNumber" placeholder="Room Number" required><br><br>

        <label for="checkIn">Check In</label><br>
        <input type="time" name="checkIn" placeholder="Check In" required><br><br>

        <label for="checkOut">Check Out</label><br>
        <input type="time" name="checkOut" placeholder="Check Out" required><br><br>

        <label for="status">Status</label><br>
        <select name="status" required>
            <option value="">-- Select --</option>
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Cancelled">Cancelled</option>
        </select><br><br>

        <button type="submit">Save</button>
    </form>
    <a href="/reservations">Back</a>
</body>
</html>
