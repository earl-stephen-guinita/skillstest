<!DOCTYPE html>
<html>
<head><title>Edit</title></head>
<body>
    <h1>Edit Reservation</h1>
    <form method="POST">
        <label for="guestName">Guest Name</label><br>
        <input type="text" name="guestName" value="{{ reservation['guestName'] }}" required><br><br>

        <label for="roomNumber">Room Number</label><br>
        <input type="text" name="roomNumber" value="{{ reservation['roomNumber'] }}" required><br><br>

        <label for="checkIn">Check In</label><br>
        <input type="date" name="checkIn" value="{{ reservation['checkIn'] }}" required><br><br>

        <label for="checkOut">Check Out</label><br>
        <input type="date" name="checkOut" value="{{ reservation['checkOut'] }}" required><br><br>

        <label for="status">Status</label><br>
        <select name="status" required>
            <option value="">-- Select --</option>
            <option value="Pending" {{ 'selected' if reservation['status'] == 'Pending' }}>Pending</option>
            <option value="Confirmed" {{ 'selected' if reservation['status'] == 'Confirmed' }}>Confirmed</option>
            <option value="Cancelled" {{ 'selected' if reservation['status'] == 'Cancelled' }}>Cancelled</option>
        </select><br><br>

        <button type="submit">Update</button>
    </form>
    <a href="/reservations">Back</a>
</body>
</html>
