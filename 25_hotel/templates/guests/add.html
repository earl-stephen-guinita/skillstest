<!DOCTYPE html>
<html>
<head><title>Add</title></head>
<body>
    <h1>Add Guest</h1>
    <form method="POST">
        <label for="firstName">First Name</label><br>
        <input type="text" name="firstName" placeholder="First Name" required><br><br>

        <label for="lastName">Last Name</label><br>
        <input type="text" name="lastName" placeholder="Last Name" required><br><br>

        <label for="contactNumber">Contact Number</label><br>
        <input type="tel" name="contactNumber" placeholder="Contact Number" required><br><br>

        <label for="checkIn">Check In</label><br>
        <input type="date" name="checkIn" placeholder="Check In" required><br><br>

        <label for="checkOut">Check Out</label><br>
        <input type="date" name="checkOut" placeholder="Check Out" required><br><br>

        <label for="status">Status</label><br>
        <select name="status" required>
            <option value="">-- Select --</option>
            <option value="Active">Active</option>
            <option value="Checked Out">Checked Out</option>
        </select><br><br>

        <button type="submit">Save</button>
    </form>
    <a href="/guests">Back</a>
</body>
</html>
