<!DOCTYPE html>
<html>
<head><title>Edit</title></head>
<body>
    <h1>Edit Guest</h1>
    <form method="POST">
        <label for="firstName">First Name</label><br>
        <input type="text" name="firstName" value="{{ guest['firstName'] }}" required><br><br>

        <label for=";astName">Last Name</label><br>
        <input type="text" name="lastName" value="{{ guest['lastName'] }}" required><br><br>

        <label for="contactNumber">Contact Number</label><br>
        <input type="tel" name="contactNumber" value="{{ guest['contactNumber'] }}" required><br><br>

        <label for="checkIn">Check In</label><br>
        <input type="time" name="checkIn" value="{{ guest['checkIn'] }}" required><br><br>

        <label for="checkOut">Check Out</label><br>
        <input type="time" name="checkOut" value="{{ guest['checkOut'] }}" required><br><br>

        <label for="status">Status</label><br>
        <select name="status" required>
            <option value="">-- Select --</option>
            <option value="Active" {{ 'selected' if guest['status'] == 'Active' }}>Active</option>
            <option value="Checked Out" {{ 'selected' if guest['status'] == 'Checked Out' }}>Checked Out</option>
        </select><br><br>

        <button type="submit">Update</button>
    </form>
    <a href="/guests">Back</a>
</body>
</html>
