<!DOCTYPE html>
<html>
<head><title>App</title></head>
<body>
    <h1>Events</h1>
    <a href="/add">Add New</a>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Event Name</th>
            <th>Location</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        {% for event in events %}
        <tr>
            <td>{{ event["id"] }}</td>
            <td>{{ event["eventName"] }}</td>
            <td>{{ event["location"] }}</td>
            <td>{{ event["date"] }}</td>
            <td>{{ event["status"] }}</td>
            <td>
                <a href="/edit/{{ event['id'] }}">Edit</a>
                <a href="/delete/{{ event['id'] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
