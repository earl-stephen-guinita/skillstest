<!DOCTYPE html>
<html>
<head><title>App</title></head>
<body>
    <h1>Books</h1>
    <a href="/add">Add New</a>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Genre</th>
            <th>Year Published</th>
            <th>Actions</th>
        </tr>
        {% for book in books %}
        <tr>
            <td>{{ book["id"] }}</td>
            <td>{{ book["title"] }}</td>
            <td>{{ book["author"] }}</td>
            <td>{{ book["genre"] }}</td>
            <td>{{ book["yearPublished"] }}</td>
            <td>
                <a href="/edit/{{ book['id'] }}">Edit</a>
                <a href="/delete/{{ book['id'] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
