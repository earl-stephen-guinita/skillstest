<!DOCTYPE html>
<html>
<head><title>Add</title></head>
<body>
    <h1>Add Hotel Room</h1>
    <form method="POST">
        <label for="roomNumber">Room Number</label><br>
        <input type="text" name="roomNumber" placeholder="Room Number"><br><br>

        <label for="roomType">Room Type</label><br>
        <select name="roomType">
            <option value="">-- Select --</option>
            <option value="Single">Single</option>
            <option value="Double">Double</option>
            <option value="Suite">Suite</option>
            <option value="Deluxe">Deluxe</option>
        </select><br><br>

        <label for="capacity">Capacity</label><br>
        <input type="number" name="capacity" placeholder="Capacity"><br><br>

        <label for="price">Price</label><br>
        <input type="number" name="price" step="0.01" placeholder="Price"><br><br>

        <label for="status">Status</label><br>
        <select name="status">
            <option value="">-- Select --</option>
            <option value="Available">Available</option>
            <option value="Occupied">Occupied</option>
            <option value="Under Maintenance">Under Maintenance</option>
        </select><br><br>

        <button type="submit">Save</button>
    </form>
    <a href="/">Back</a>
</body>
</html>
