<!DOCTYPE html>
<html>
<head><title>Edit</title></head>
<body>
    <h1>Edit Book</h1>
    <form method="POST">
        <label for="title">Title</label><br>
        <input type="text" name="title" value="{{ book['title'] }}" required><br><br>

        <label for="genre">Genre</label><br>
        <input type="text" name="genre" value="{{ book['genre'] }}" required><br><br>

        <label for="yearPublished">Year Published</label><br>
        <input type="text" name="yearPublished" value="{{ book['yearPublished'] }}" required><br><br>

        <label for="status">Status</label><br>
        <select name="status" required>
            <option value="">-- Select --</option>
            <option value="Available" {{ 'selected' if book['status'] == 'Available' }}>Available</option>
            <option value="Borrowed" {{ 'selected' if book['status'] == 'Borrowed' }}>Borrowed</option>
            <option value="Damaged" {{ 'selected' if book['status'] == 'Damaged' }}>Damaged</option>
        </select><br><br>

        <button type="submit">Update</button>
    </form>
    <a href="/books">Back</a>
</body>
</html>
