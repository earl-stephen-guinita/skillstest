<!DOCTYPE html>
<html>
<head><title>Books</title></head>
<body>
    <h1>Books</h1>
    <a href="/books/add">Add New</a>
    <a href="/">Back to Main Menu</a>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Genre</th>
            <th>Year Published</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        {% for book in books %}
        <tr>
            <td>{{ book["id"] }}</td>
            <td>{{ book["title"] }}</td>
            <td>{{ book["genre"] }}</td>
            <td>{{ book["yearPublished"] }}</td>
            <td>{{ book["status"] }}</td>
            <td>
                <a href="/books/edit/{{ book['id'] }}">Edit</a>
                <a href="/books/delete/{{ book['id'] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
