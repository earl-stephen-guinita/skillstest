<!DOCTYPE html>
<html>
<head><title>Search</title></head>
<body>
    <h1>Search Sales</h1>
    <a href="/">Back to Main Menu</a><br><br>

    <form method="GET">
        <label for="keyword">Search by Medicine Name</label><br>
        <input type="text" name="keyword" value="{{ keyword }}" placeholder="Enter Medicine Name"><br><br>
        <button type="submit">Search</button>
    </form>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Customer Name</th>
            <th>Medicine Name</th>
            <th>Quantity</th>
            <th>Total Price</th>
            <th>Sale Date</th>
        </tr>
        {% for sale in sales %}
        <tr>
            <td>{{ sale["id"] }}</td>
            <td>{{ sale["customerName"] }}</td>
            <td>{{ sale["medicineName"] }}</td>
            <td>{{ sale["quantity"] }}</td>
            <td>{{ sale["totalPrice"] }}</td>
            <td>{{ sale["saleDate"] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
