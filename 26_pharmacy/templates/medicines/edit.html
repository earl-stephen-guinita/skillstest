<!DOCTYPE html>
<html>
<head><title>Edit</title></head>
<body>
    <h1>Edit Medicine</h1>
    <form method="POST">
        <label for="medicineName">Medicine Name</label><br>
        <input type="text" name="medicineName" value="{{ medicine['medicineName'] }}" required><br><br>

        <label for="category">Category</label><br>
        <select name="category" required>
            <option value="">-- Select --</option>
            <option value="Antibiotic" {{ 'selected' if medicine['category'] == 'Antibiotic' }}>Antibiotic</option>
            <option value="Painkiller" {{ 'selected' if medicine['category'] == 'Painkiller' }}>Painkiller</option>
            <option value="Vitamin" {{ 'selected' if medicine['category'] == 'Vitamin' }}>Vitamin</option>
            <option value="Others" {{ 'selected' if medicine['category'] == 'Others' }}>Others</option>
        </select><br><br>

        <label for="price">Price</label><br>
        <input type="number" name="price" step="0.01" value="{{ medicine['price'] }}" required><br><br>

        <label for="stock">Stock</label><br>
        <input type="number" name="stock" value="{{ medicine['stock'] }}" required><br><br>

        <label for="status">Status</label><br>
        <select name="status" required>
            <option value="">-- Select --</option>
            <option value="Available" {{ 'selected' if medicine['status'] == 'Available' }}>Available</option>
            <option value="Out of Stock" {{ 'selected' if medicine['status'] == 'Out of Stock' }}>Out of Stock</option>
            <option value="Expired" {{ 'selected' if medicine['status'] == 'Expired' }}>Expired</option>
        </select><br><br>

        <button type="submit">Update</button>
    </form>
    <a href="/medicines">Back</a>
</body>
</html>
