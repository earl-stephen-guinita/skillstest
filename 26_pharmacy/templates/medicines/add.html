<!DOCTYPE html>
<html>
<head><title>Add</title></head>
<body>
    <h1>Add Medicine</h1>
    <form method="POST">
        <label for="medicineName">Medicine Name</label><br>
        <input type="text" name="medicineName" placeholder="Medicine Name" required><br><br>
        
        <label for="category">Category</label><br>
        <select name="category" required>
            <option value="">-- Select --</option>
            <option value="Antibiotic">Antibiotic</option>
            <option value="Painkiller">Painkiller</option>
            <option value="Vitamin">Vitamin</option>
            <option value="Others">Others</option>
        </select><br><br>

        <label for="price">Price</label><br>
        <input type="number" name="price" step="0.01" placeholder="Price" required><br><br>

        <label for="stock">Stock</label><br>
        <input type="number" name="stock" placeholder="Stock" required><br><br>

        <label for="status">Status</label><br>
        <select name="status" required>
            <option value="">-- Select --</option>
            <option value="Available">Available</option>
            <option value="Out of Stock">Out of Stock</option>
            <option value="Expired">Expired</option>
        </select><br><br>

        <button type="submit">Save</button>
    </form>
    <a href="/medicines">Back</a>
</body>
</html>
