<!DOCTYPE html>
<html>
<head><title>Edit</title></head>
<body>
    <h1>Edit Student</h1>
    <form method="POST">
        <input type="text" name="firstName" value="{{ student['firstName'] }}"><br>
        <input type="text" name="lastName" value="{{ student['lastName'] }}"><br>
        <input type="text" name="course" value="{{ student['course'] }}"><br>
        <input type="number" name="yearLevel" value="{{ student['yearLevel'] }}"><br>
        <button type="submit">Update</button>
    </form>
    <a href="/">Back</a>
</body>
</html>
