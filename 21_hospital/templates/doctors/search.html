<!DOCTYPE html>
<html>
<head><title>Search</title></head>
<body>
    <h1>Search Doctors</h1>
    <a href="/">Back to Main Menu</a><br><br>

    <form method="GET">
        <label for="keyword">Search by Specialization</label><br>
        <input type="text" name="keyword" value="{{ keyword }}" placeholder="Enter Specialization"><br><br>
        <button type="submit">Search</button>
    </form>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Specialization</th>
            <th>Status</th>
        </tr>
        {% for doctor in doctors %}
        <tr>
            <td>{{ doctor["id"] }}</td>
            <td>{{ doctor["firstName"] }}</td>
            <td>{{ doctor["lastName"] }}</td>
            <td>{{ doctor["specialization"] }}</td>
            <td>{{ doctor["status"] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
