<!DOCTYPE html>
<html>
<head><title>Edit</title></head>
<body>
    <h1>Edit Expenses</h1>
    <form method="POST">
        <input type="text" name="description" value="{{ expense['description'] }}"><br>
        <input type="number" name="amount" step="0.01" value="{{ expense['amount'] }}"><br>
        <select name="category">
            <option value="">-- Select --</option>
            <option value="Food" {{ 'selected' if expense['category'] == 'Food' }}>Food</option>
            <option value="Transport" {{ 'selected' if expense['category'] == 'Transport' }}>Transport</option>
            <option value="Utilities" {{ 'selected' if expense['category'] == 'Utilities' }}>Utilities</option>
            <option value="Others" {{ 'selected' if expense['category'] == 'Others' }}>Others</option>
        </select><br>
        <input type="date" name="date" value="{{ expense['date'] }}"><br>
        <button type="submit">Update</button>
    </form>
    <a href="/">Back</a>
</body>
</html>
