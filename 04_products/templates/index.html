<!DOCTYPE html>
<html>
<head><title>App</title></head>
<body>
    <h1>Products</h1>
    <a href="/add">Add New</a>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Actions</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product["id"] }}</td>
            <td>{{ product["name"] }}</td>
            <td>{{ product["category"] }}</td>
            <td>{{ product["price"] }}</td>
            <td>{{ product["quantity"] }}</td>
            <td>
                <a href="/edit/{{ product['id'] }}">Edit</a>
                <a href="/delete/{{ product['id'] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
