<!DOCTYPE html>
<html>
<head><title>Add</title></head>
<body>
    <h1>Add Product</h1>
    <form method="POST">
        <label for="productName">Product Name</label><br>
        <input type="text" name="productName" placeholder="Product Name" required><br><br>

        <label for="price">Price</label><br>
        <input type="number" name="price" step="0.01" placeholder="Price" required><br><br>

        <label for="stock">Stock</label><br>
        <input type="number" name="stock" placeholder="Stock" required><br><br>

        <label for="status">Status</label>
        <select name="status">
            <option value="">-- Select --</option>
            <option value="Available">Available</option>
            <option value="Out of Stock">Out of Stock</option>
        </select><br><br>
    
        <button type="submit">Save</button>
    </form>
    <a href="/products">Back</a>
</body>
</html>
