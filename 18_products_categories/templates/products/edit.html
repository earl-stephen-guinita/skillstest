<!DOCTYPE html>
<html>
<head><title>Edit</title></head>
<body>
    <h1>Edit Product</h1>
    <form method="POST">
        <label for="productName">Product Name</label><br>
        <input type="text" name="productName" value="{{ product['productName'] }}" required><br><br>

        <label for="price">Price</label><br>
        <input type="number" name="price" step="0.01" value="{{ product['price'] }}" required><br><br>

        <label for="stock">Stock</label><br>
        <input type="number" name="stock" value="{{ product['stock'] }}" required><br><br>

        <label for="status">Status</label>
        <select name="status" required>
            <option value="">-- Select --</option>
            <option value="Available" {{ 'selected' if product['status'] == 'Available' }}>Available</option>
            <option value="Out of Stock" {{ 'selected' if product['status'] == 'Out of Stock' }}>Out of Stock</option>
        </select><br><br>
    
        <button type="submit">Update</button>
    </form>
    <a href="/products">Back</a>
</body>
</html>
