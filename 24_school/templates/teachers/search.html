<!DOCTYPE html>
<html>
<head><title>Search</title></head>
<body>
    <h1>Search Teachers</h1>
    <a href="/">Back to Main Menu</a><br><br>

    <form method="GET">
        <label for="keyword">Search by Subject</label><br>
        <input type="text" name="keyword" value="{{ keyword }}" placeholder="Enter Subject"><br><br>
        <button type="submit">Search</button>
    </form>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Subject</th>
            <th>Contact Number</th>
            <th>Status</th>
        </tr>
        {% for teacher in teachers %}
        <tr>
            <td>{{ teacher["id"] }}</td>
            <td>{{ teacher["firstName"] }}</td>
            <td>{{ teacher["lastName"] }}</td>
            <td>{{ teacher["subject"] }}</td>
            <td>{{ teacher["contactNumber"] }}</td>
            <td>{{ teacher["status"] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
