<!DOCTYPE html>
<html>
<head><title>Add</title></head>
<body>
    <h1>Add Product</h1>
    <form method="POST">
        <label for="productName">Name of Product</label><br>
        <input type="text" name="productName" placeholder="Name of Product" required><br><br>

        <label for="price">Price</label><br>
        <input type="number" name="price" step="0.01" placeholder="Price" required><br><br>

        <label for="stock">Stock</label><br>
        <input type="number" name="stock" placeholder="Stock" required><br><br>

        <label for="category">Category</label><br>
        <select name="category" required>
            <option value="">-- Select --</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Food">Food</option>
            <option value="Others">Others</option>
        </select><br><br>

        <button type="submit">Save</button>
    </form>
    <a href="/products">Back</a>
</body>
</html>
