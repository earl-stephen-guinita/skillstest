<!DOCTYPE html>
<html>
<head><title>Add</title></head>
<body>
    <h1>Add Supplier</h1>
    <form method="POST">
        <label for="supplierName">Name of Supplier</label><br>
        <input type="text" name="supplierName" placeholder="Name of Supplier" required><br><br>

        <label for="contactNumber">Contact Number</label><br>
        <input type="tel" name="contactNumber" placeholder="Contact Number" required><br><br>

        <label for="address">Address</label><br>
        <input type="text" name="address" placeholder="Address" required><br><br>

        <label for="status">Status</label><br>
        <select name="status" required>
            <option value="">-- Select --</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select><br><br>

        <button type="submit">Save</button>
    </form>
    <a href="/suppliers">Back</a>
</body>
</html>
