<!DOCTYPE html>
<html>
<head><title>Edit</title></head>
<body>
    <h1>Edit Employee</h1>
    <form method="POST">
        <input type="text" name="firstName" value="{{ employee['firstName'] }}"><br>
        <input type="text" name="lastName" value="{{ employee['lastName'] }}"><br>
        <input type="text" name="position" value="{{ employee['position'] }}"><br>
        <input type="number" name="salary" value="{{ employee['salary'] }}"><br>
        <button type="submit">Update</button>
    </form>
    <a href="/">Back</a>
</body>
</html>
